<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>VivaioApp — Gestionale</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:15px;color:#1a1a1a;background:#f3f4f2}
input,select,textarea{font-family:inherit;font-size:16px;padding:9px 12px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:#3B6D11;box-shadow:0 0 0 2px rgba(59,109,17,.1)}
input[type=checkbox]{width:18px;height:18px;accent-color:#3B6D11;flex-shrink:0}
textarea{resize:vertical}
button{cursor:pointer;font-family:inherit}
.btn-g{background:#3B6D11;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:15px;font-weight:500}
.btn-g:disabled{opacity:.5;cursor:default}
.btn-n{background:#fff;color:#1a1a1a;border:1px solid #ccc;border-radius:8px;padding:10px 16px;font-size:15px}
.btn-r{background:#fff;color:#A32D2D;border:1px solid #F7C1C1;border-radius:8px;padding:7px 12px;font-size:13px}
.sm{padding:6px 10px!important;font-size:13px!important}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:1rem}
/* Tables: horizontal scroll on mobile */
.tbl-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;min-width:500px}
.tbl th{padding:9px 12px;text-align:left;font-weight:500;font-size:13px;background:#f5f5f3;color:#666;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid #eee;font-size:14px}
.lbl{font-size:14px;color:#666;display:block;margin-bottom:5px}
/* Modal: full screen on mobile */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;overflow-y:auto}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:1.5rem;width:100%;max-height:92vh;overflow-y:auto}
/* Tab bar */
.tab-bar{display:flex;border-bottom:1px solid #e5e5e5;margin-bottom:1.25rem;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tab-bar::-webkit-scrollbar{display:none}
.tab{background:transparent;border:none;border-bottom:2px solid transparent;padding:11px 14px;font-size:14px;color:#666;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.tab.active{border-bottom-color:#3B6D11;color:#3B6D11;font-weight:500}
.stat{background:#f5f5f3;border-radius:10px;padding:12px}
.stat p:first-child{font-size:12px;color:#666;margin-bottom:4px}
.stat p:last-child{font-size:22px;font-weight:600}
.badge{font-size:12px;border-radius:4px;padding:2px 8px;white-space:nowrap}
.bg{background:#C0DD97;color:#27500A}.ba{background:#FAC775;color:#633806}.bb{background:#B5D4F4;color:#0C447C}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bar-bg{background:#eee;border-radius:4px;height:6px}
.bar-fill{background:#3B6D11;border-radius:4px;height:6px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 1rem;border-bottom:1px solid #e5e5e5;background:#fff;position:sticky;top:0;z-index:10}
.success-box{background:#EAF3DE;border:1px solid #C0DD97;border-radius:8px;padding:10px 14px;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;color:#27500A;font-size:14px}
.spin{display:inline-block;width:20px;height:20px;border:2px solid #ddd;border-top-color:#3B6D11;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media print{body{background:#fff}.no-print{display:none!important}.print-only{display:block!important}}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e5e5;display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;border:none;background:transparent;cursor:pointer;gap:3px;-webkit-tap-highlight-color:transparent;position:relative}
.bnav-icon{font-size:22px;line-height:1}
.bnav-lbl{font-size:10px;color:#999;line-height:1}
.bnav-btn.active .bnav-lbl{color:#3B6D11;font-weight:600}
.bnav-btn.active .bnav-icon{filter:none}
.bnav-badge{position:absolute;top:4px;right:calc(50% - 16px);background:#E24B4A;color:#fff;border-radius:10px;font-size:10px;font-weight:700;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.content-with-nav{padding-bottom:80px}
.fab{position:fixed;bottom:72px;right:16px;width:52px;height:52px;border-radius:50%;background:#3B6D11;color:#fff;border:none;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(59,109,17,.4);cursor:pointer;z-index:15;-webkit-tap-highlight-color:transparent}
.print-only{display:none}

/* ── MOBILE ── */
@media(max-width:640px){
  body{font-size:14px;background:#f3f4f2}
  input,select,textarea{font-size:16px}/* prevent iOS zoom */
  .card{border-radius:10px;padding:.875rem}
  .grid2,.grid3,.grid4{grid-template-columns:1fr!important;gap:10px}
  .modal{border-radius:16px 16px 0 0;padding:1.25rem 1rem;max-height:94vh}
  .overlay{align-items:flex-end}
  .topbar{padding:10px 1rem}
  .topbar .topbar-title{font-size:14px}
  .btn-g,.btn-n,.btn-r{padding:11px 16px;font-size:14px;border-radius:10px}
  .sm{padding:8px 10px!important;font-size:13px!important}
  .tbl th,.tbl td{padding:8px 10px;font-size:13px}
  .stat p:last-child{font-size:20px}
  .tab{padding:10px 12px;font-size:13px}
  /* Full-width buttons on mobile forms */
  .mob-full{width:100%!important}
  /* Padding for main content */
  .main-pad{padding:.875rem!important}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="text/babel">
// ── GLOBALS ──
const {useState,useEffect,useRef} = React;
const h = React.createElement;
const SB   = 'https://ikxhdmxjvodcyypnmsuh.supabase.co';
const KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlreGhkbXhqdm9kY3l5cG5tc3VoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3ODk3MTYsImV4cCI6MjA5NTM2NTcxNn0.KEtZDskCrvmE4K2EOzqYXRq12bvligwhRLnoeeR6X5Q';
const SBH  = {'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'};
// Token bot gestiti server-side tramite Supabase Secrets
const TG_PROXY = SB+'/functions/v1/super-responder';
const Badge = ({c,children}) => h('span',{className:'badge b'+c},children);
function gid(){ return Math.random().toString(36).slice(2)+Date.now().toString(36); }

// Ritorna sempre l'array dei settori di una lavorazione (multi-settore + retrocompat con settoreId singolo)
function lavSettori(l){
  if(l && Array.isArray(l.settoreIds) && l.settoreIds.length) return l.settoreIds;
  if(l && l.settoreId) return [l.settoreId];
  return [];
}
// Nomi settori separati da virgola per la visualizzazione
function settoriNomi(l,settoriList){
  const ids=lavSettori(l);
  if(!ids.length) return '';
  return ids.map(id=>{const s=(settoriList||[]).find(x=>x.id===id);return s?s.nome:'?';}).join(', ');
}

// ── PIANI (Starter/Pro/Enterprise) ──
// I tenant registrati prima dell'introduzione del campo "piano" non ce l'hanno valorizzato: li trattiamo come Pro
// per non rompere account di test/demo esistenti. Ogni nuova registrazione scrive già il piano scelto.
const PIANO_LIMITS = {
  starter: { centri: 3, dipendenti: 15 },
  pro: { centri: Infinity, dipendenti: Infinity },
  enterprise: { centri: Infinity, dipendenti: Infinity }
};
function pianoOf(user){
  return (user && user.tenant && user.tenant.piano) || 'pro';
}
function pianoLimits(user){
  return PIANO_LIMITS[pianoOf(user)] || PIANO_LIMITS.pro;
}
function UpgradeLock({feature}){
  return h('div',{className:'card',style:{textAlign:'center',padding:'2rem 1.5rem'}},
    h('div',{style:{fontSize:'32px',marginBottom:'8px'}},'🔒'),
    h('p',{style:{fontWeight:600,fontSize:'15px',marginBottom:'4px'}},feature+' è disponibile dal piano Pro'),
    h('p',{style:{fontSize:'13px',color:'#666',marginBottom:'14px'}},'Passa a Pro per sbloccarla, oppure scrivici per attivarla sul tuo account.'),
    h('a',{href:'mailto:info@vivaioapp.it?subject=Upgrade%20a%20Pro',className:'btn-g sm',style:{textDecoration:'none',display:'inline-block'}},'Passa a Pro →')
  );
}

// ── DB ──
async function sbGet(tbl,tid){
  const q = tid ? '?tenantId=eq.'+tid+'&order=id' : '?order=id';
  const r = await fetch(SB+'/rest/v1/'+tbl+q,{headers:SBH});
  return r.json();
}
async function sbIns(tbl,d){
  const r = await fetch(SB+'/rest/v1/'+tbl,{method:'POST',headers:SBH,body:JSON.stringify(d)});
  return r.json();
}
async function sbUpd(tbl,id,d){
  await fetch(SB+'/rest/v1/'+tbl+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:SBH,body:JSON.stringify(d)});
}
async function sbDel(tbl,id){
  await fetch(SB+'/rest/v1/'+tbl+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:SBH});
}

// ── TELEGRAM ──
async function tgSend(chatId,text,botName='vivaioapp'){
  if(!chatId) return;
  try{
    await fetch(TG_PROXY,{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY,'apikey':KEY},
      body:JSON.stringify({botName,chat_id:chatId,text})});
  }catch(e){ console.error('TG',e); }
}
async function notifyResponsabili(centroId,msg,data){
  const uu = (data.utenti||[]).filter(u=>u.ruolo!=='admin'&&(u.centroIds||[]).includes(centroId));
  for(const u of uu){ if(u.tgChatId) await tgSend(u.tgChatId,msg); }
}
async function notifyAdmin(msg,data){
  const uu = (data.utenti||[]).filter(u=>u.ruolo==='admin'&&u.tgChatId);
  for(const u of uu){ await tgSend(u.tgChatId,msg); }
}

// ── UI COMPONENTS ──
function Stat({label,value}){return h('div',{className:'stat'},h('p',null,label),h('p',null,value));}

function Modal({title,onClose,children}){
  return h('div',{className:'overlay',onClick:e=>e.target.className==='overlay'&&onClose()},
    h('div',{className:'modal'},
      h('div',{style:{width:'40px',height:'4px',background:'#ddd',borderRadius:'2px',margin:'-8px auto 12px',flexShrink:0}}),
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.25rem'}},
        h('h2',{style:{fontSize:'16px',fontWeight:500}},title),
        h('button',{onClick:onClose,className:'btn-n sm'},'✕')
      ),children
    )
  );
}

function TrialBanner({user}){
  if(!user||!user.tenant) return null;
  const trialEnd = new Date(user.tenant.trialEndsAt);
  const daysLeft = Math.ceil((trialEnd - new Date())/(1000*60*60*24));
  if(daysLeft > 3 || daysLeft <= 0) return null;
  return h('div',{style:{background:daysLeft<=1?'#c0392b':'#e67e22',color:'white',padding:'8px 16px',textAlign:'center',fontSize:'13px',fontWeight:500}},
    daysLeft<=1
      ? '⚠️ Ultimo giorno di trial! Contatta VivaioApp per non perdere i dati.'
      : '⏳ Il tuo trial scade tra '+daysLeft+' giorni. Contattaci per attivare il piano.'
  );
}
function TopBar({title,user,logout,extra}){
  return h('div',{className:'topbar'},
    h('div',{style:{display:'flex',alignItems:'center',gap:'6px',minWidth:0,flex:1}},
      h('img',{src:'vivaioapp-logo-cropped.svg',alt:'VivaioApp',style:{height:'40px',width:'auto',flexShrink:0}}),
      h('div',{style:{minWidth:0}},
        h('div',{style:{fontWeight:600,fontSize:'14px',lineHeight:1.2}},user.tenant?.nome||'VivaioApp'),
        h('div',{style:{fontSize:'12px',color:'#666',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},title)
      )
    ),
    h('div',{style:{display:'flex',alignItems:'center',gap:'6px',flexShrink:0}},
      extra&&extra,
      h('div',{style:{fontSize:'12px',color:'#888',maxWidth:'90px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},user.nome),
      h('button',{onClick:logout,className:'btn-n',style:{padding:'6px 10px',fontSize:'13px',whiteSpace:'nowrap'}},'Esci')
    )
  );
}

// ── LOGIN ──
function Login({onLogin}){
  const [uname,setUname]    = useState('');
  const [pass,setPass]      = useState('');
  const [err,setErr]        = useState('');
  const [busy,setBusy]      = useState(false);

  const doLogin = async () => {
    if(!uname.trim()||!pass.trim()){ setErr('Inserisci username e password.'); return; }
    setBusy(true); setErr('');
    try {
      // Cerca l'username in tutti i tenant
      const r = await fetch(SB+'/rest/v1/utenti?username=eq.'+encodeURIComponent(uname.trim()),{headers:SBH});
      const list = await r.json();
      const match = (list||[]).filter(u=>u.pass===pass);
      if(!match.length){ setErr('Credenziali non valide.'); setBusy(false); return; }
      if(match.length>1){ setErr('Username ambiguo. Contatta VivaioApp.'); setBusy(false); return; }
      const usr = match[0];
      // Recupera il tenant associato all'utente
      const rt = await fetch(SB+'/rest/v1/tenants?id=eq.'+encodeURIComponent(usr.tenantId),{headers:SBH});
      const tlist = await rt.json();
      if(!tlist||!tlist.length){ setErr('Account non trovato. Contatta VivaioApp.'); setBusy(false); return; }
      const tenant = tlist[0];
      if(!tenant.attivo){ setErr('Account sospeso. Contatta VivaioApp.'); setBusy(false); return; }
      sessionStorage.setItem('va_tenant',JSON.stringify(tenant));
      const u = Object.assign({},usr,{tenant});
      try{ sessionStorage.setItem('va_user',JSON.stringify(u)); }catch{}
      // Notify super-admin if trial expiring soon
      const trialEnd = new Date(tenant.trialEndsAt);
      const daysLeft = Math.ceil((trialEnd - new Date())/(1000*60*60*24));
      if(daysLeft <= 2 && daysLeft > 0){
        tgSend(616409100,'⏰ <b>Trial in scadenza</b>\n\n🌿 Vivaio: <b>'+tenant.nome+'</b>\n📧 Email: '+tenant.email+'\n⏳ Scade tra: <b>'+daysLeft+' giorn'+(daysLeft===1?'o':'i')+'</b>\n\n👉 Contattalo per convertirlo!').catch(()=>{});
      }
      if(daysLeft <= 0){
        tgSend(616409100,'🔴 <b>Trial SCADUTO</b>\n\n🌿 Vivaio: <b>'+tenant.nome+'</b>\n📧 Email: '+tenant.email+'\n\n👉 Contattalo subito o disattiva l\'account dal super admin.').catch(()=>{});
      }
      onLogin(u);
    } catch{ setErr('Errore di rete. Riprova.'); }
    setBusy(false);
  };

  return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'1.5rem',background:'#f3f4f2'}},
    h('div',{style:{width:'100%',maxWidth:'380px'}},
      h('div',{style:{textAlign:'center',marginBottom:'2rem'}},
        h('img',{src:'vivaioapp-logo-cropped.svg',alt:'VivaioApp',style:{width:'240px',height:'auto',display:'block',margin:'0 auto'}}),
        h('p',{style:{fontSize:'13px',color:'#999',marginTop:'6px'}},'Gestionale aziendale')
      ),
      h('div',{className:'card',style:{padding:'1.75rem'}},
        h('div',null,
          h('h2',{style:{fontSize:'16px',fontWeight:600,marginBottom:'4px'}},'Accedi al tuo vivaio'),
          h('p',{style:{fontSize:'13px',color:'#888',marginBottom:'1.25rem'}},'Inserisci username e password'),
          h('label',{className:'lbl'},'Username'),
          h('input',{value:uname,onChange:e=>setUname(e.target.value),style:{marginBottom:'12px'},autoFocus:true,
            onKeyDown:e=>e.key==='Enter'&&doLogin()}),
          h('label',{className:'lbl'},'Password'),
          h('input',{type:'password',value:pass,onChange:e=>setPass(e.target.value),style:{marginBottom:'1rem'},
            onKeyDown:e=>e.key==='Enter'&&doLogin()}),
          err&&h('p',{style:{color:'#A32D2D',fontSize:'13px',marginBottom:'12px'}},err),
          h('button',{onClick:doLogin,className:'btn-g',style:{width:'100%'},disabled:busy},busy?'Accesso...':'Accedi')
        )
      ),
      h('p',{style:{textAlign:'center',fontSize:'12px',color:'#bbb',marginTop:'1rem'}},'© 2025 VivaioApp')
    )
  );
}

// ── SV COMPONENTS (Tabs → RespApp) ──
function Tabs({tabs,active,onChange}){
  return h('div',{className:'tab-bar'},
    tabs.map(t=>h('button',{key:t.id,className:'tab'+(active===t.id?' active':''),onClick:()=>onChange(t.id)},t.label))
  );
}

/* ── LOGIN ── */

function CentriTab({data,save,user}){
  const limC=pianoLimits(user).centri;
  const [selC,setSelC]=useState(null);const [modal,setModal]=useState(null);const [form,setForm]=useState({});const [saving,setSaving]=useState(false);
  const F=k=>e=>setForm(f=>({...f,[k]:e.target.value}));
  const close=()=>{setModal(null);setForm({});};
  const savCentro=async()=>{
    if(!form.nome?.trim())return;setSaving(true);
    const c=form.id?data.centri.map(x=>x.id===form.id?form:x):[...data.centri,{id:gid(),...form}];
    await save({...data,centri:c});setSaving(false);close();
  };
  const savSettore=async()=>{
    if(!form.nome?.trim())return;setSaving(true);
    const varieta=(form.varieta||[]).filter(v=>v.nome?.trim()).map(v=>({nome:v.nome,quantita:parseInt(v.quantita)||0,vaso:v.vaso||'',fornitore:v.fornitore||'',dataEntrata:v.dataEntrata||''}));
    const totPiante=varieta.reduce((s,v)=>s+(parseInt(v.quantita)||0),0);
    const sClean={...form,
      varieta,
      capacita:totPiante||parseInt(form.capacita)||0,
      lunghezza:form.lunghezza?parseFloat(form.lunghezza):null,
      larghezza:form.larghezza?parseFloat(form.larghezza):null,
      fornitore:form.fornitore||'',
      dataEntrata:form.dataEntrata||null,
      note:form.note||''
    };
    const s=form.id?data.settori.map(x=>x.id===form.id?sClean:x):[...data.settori,{id:gid(),centroId:selC,...sClean}];
    await save({...data,settori:s});setSaving(false);close();
  };
  const delC=async id=>{if(!confirm('Eliminare il centro e i suoi settori?'))return;await save({...data,centri:data.centri.filter(c=>c.id!==id),settori:data.settori.filter(s=>s.centroId!==id)});if(selC===id)setSelC(null);};
  const delS=async id=>{if(!confirm('Eliminare settore?'))return;await save({...data,settori:data.settori.filter(s=>s.id!==id)});};
  const cur=data.centri.find(c=>c.id===selC);
  const setts=data.settori.filter(s=>s.centroId===selC);
  return h('div',null,
    h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:'1rem'}},
      h('div',null,
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}},
          h('h3',{style:{fontSize:'15px',fontWeight:500}},'Centri ('+data.centri.length+(limC===Infinity?'':'/'+limC)+')'),
          h('button',{onClick:()=>{setForm({});setModal('centro');},className:'btn-g sm',disabled:data.centri.length>=limC},'+ Aggiungi')
        ),
        limC!==Infinity&&data.centri.length>=limC&&h('p',{style:{fontSize:'12px',color:'#A32D2D',marginBottom:'10px'}},'Hai raggiunto il limite di centri del piano Starter. Passa a Pro per continuare ad aggiungerne.'),
        h('div',{className:'card',style:{padding:0,overflowX:'auto',WebkitOverflowScrolling:'touch'}},
          data.centri.length===0?h('p',{style:{padding:'1rem',fontSize:'13px',color:'#666'}},'Nessun centro.'):
          h('table',{className:'tbl'},
            h('thead',null,h('tr',null,h('th',null,'Nome'),h('th',null,'Sett.'),h('th',{style:{width:'70px'}}))),
            h('tbody',null,data.centri.map(c=>h('tr',{key:c.id,onClick:()=>setSelC(c.id),style:{cursor:'pointer',background:selC===c.id?'#EAF3DE':''}},
              h('td',{style:{fontWeight:selC===c.id?500:400}},c.nome),
              h('td',{style:{color:'#666'}},data.settori.filter(s=>s.centroId===c.id).length),
              h('td',null,h('div',{style:{display:'flex',gap:'4px'}},
                h('button',{onClick:e=>{e.stopPropagation();setForm(c);setModal('centro');},className:'btn-n sm'},'✏️'),
                h('button',{onClick:e=>{e.stopPropagation();delC(c.id);},className:'btn-r sm'},'🗑')
              ))
            )))
          )
        )
      ),

function DipList({data,checked,onToggle,oreMap,onOreChange,showOre,errBorder}){
  const [q,setQ]=useState('');
  const filtered=[...(data.dipendenti||[])].sort((a,b)=>(a.cognome||'').localeCompare(b.cognome||'')).filter(d=>{
    if(!q.trim())return true;
    const s=q.toLowerCase();
    return (d.cognome||'').toLowerCase().includes(s)||(d.nome||'').toLowerCase().includes(s);
  });
  const totOre=checked.reduce((s,id)=>s+(parseFloat((oreMap||{})[id])||0),0);
  return h('div',null,
    h('input',{placeholder:'Cerca dipendente...',value:q,onChange:e=>setQ(e.target.value),style:{marginBottom:'6px',fontSize:'13px'}}),
    h('div',{style:{border:'1px solid '+(errBorder?'#F7C1C1':'#ccc'),borderRadius:'8px',padding:'8px',maxHeight:'200px',overflowY:'auto'}},
      filtered.length===0?h('p',{style:{fontSize:'13px',color:'#999',padding:'4px'}},'Nessun risultato.'):
      filtered.map(d=>{
        const isChecked=checked.includes(d.id);

          h('label',{style:{display:'flex',alignItems:'center',gap:'8px',cursor:'pointer',fontSize:'14px',flex:1,minWidth:0}},

      h('select',{value:selCentro,onChange:e=>{setSelCentro(e.target.value);setForm(f=>({...f,settoreId:'',settoreIds:[],varietaId:''}));},style:err.c?er:{}},
        h('option',{value:''},'— Seleziona —'),

      )
    ),

/* ── PRIORITÀ DOT ── */
function PrioDot({value,onChange}){
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    if(!open)return;
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',h);
    return()=>document.removeEventListener('mousedown',h);
  },[open]);
  const COLORS={alta:'#E24B4A',media:'#EF9F27',bassa:'#639922','':'#ccc'};
  const LABELS={alta:'Alta',media:'Media',bassa:'Bassa','':'Nessuna'};
  const opts=['alta','media','bassa',''];
  return h('div',{ref,style:{position:'relative',display:'inline-block'}},
    h('span',{
      onClick:e=>{e.stopPropagation();setOpen(o=>!o);},
      title:LABELS[value]||'Nessuna priorità',
      style:{display:'inline-block',width:'16px',height:'16px',borderRadius:'50%',background:COLORS[value]||COLORS[''],cursor:'pointer',border:'2px solid rgba(0,0,0,.12)',verticalAlign:'middle',flexShrink:0}
    }),
    open&&h('div',{
      style:{position:'absolute',top:'22px',left:'50%',transform:'translateX(-50%)',background:'#fff',border:'1px solid #e5e5e5',borderRadius:'10px',padding:'8px',zIndex:50,boxShadow:'0 4px 12px rgba(0,0,0,.12)',display:'flex',flexDirection:'column',gap:'6px',minWidth:'110px'},
      onClick:e=>e.stopPropagation()
    },
      opts.map(v=>h('label',{key:v,onClick:()=>{onChange(v);setOpen(false);},style:{display:'flex',alignItems:'center',gap:'8px',cursor:'pointer',fontSize:'13px',padding:'4px 6px',borderRadius:'6px',background:value===v?'#f5f5f3':'transparent',fontWeight:value===v?500:400}},

  );
}

          h('thead',null,h('tr',null,

/* ── DA FARE ── */
function DaFareTab({data,save,centroId}){
  const [modal,setM]=useState(null);const [form,setForm]=useState({});const [saving,setSaving]=useState(false);
  const F=k=>e=>setForm(f=>({...f,[k]:e.target.value}));
  const settori=(data.settori||[]).filter(s=>centroId?s.centroId===centroId:true);
  const PORD={alta:0,media:1,bassa:2,'':3};
  const myLav=(data.lavorazioni||[]).filter(l=>(centroId?l.centroId===centroId:true)&&(l.stato==='confermata'||l.stato==='da_fare')).sort((a,b)=>{
    const pd=(PORD[a.priorita||'']??3)-(PORD[b.priorita||'']??3);
    if(pd!==0)return pd;
    if(!a.data&&!b.data)return 0;if(!a.data)return 1;if(!b.data)return -1;
    return String(a.data).localeCompare(String(b.data));
  });
  const [editingDate,setEditingDate]=useState(null);
  const saveDate=async(lav,newDate)=>{
    await save({...data,lavorazioni:data.lavorazioni.map(l=>l.id===lav.id?{...l,data:newDate}:l)});
    setEditingDate(null);
  };
  const tog=id=>setForm(f=>{
    const inList=(f.dipendentiIds||[]).includes(id);
    const newOreMap={...(f.oreMap||{})};
    if(inList)delete newOreMap[id];
    return{...f,dipendentiIds:inList?(f.dipendentiIds||[]).filter(x=>x!==id):[...(f.dipendentiIds||[]),id],oreMap:newOreMap};
  });
  const setOre2=(id,v)=>setForm(f=>({...f,oreMap:{...(f.oreMap||{}),[id]:v}}));
  const [settComplete,setSettComplete]=useState([]); // settori spuntati come lavorati (modal completa)
  const togSettC=id=>setSettComplete(cur=>cur.includes(id)?cur.filter(x=>x!==id):[...cur,id]);
  const close=()=>{setM(null);setForm({});setSettComplete([]);};

  const openEdit=l=>{ setForm({...l,settoreIds:lavSettori(l),ore:l.ore!=null?String(l.ore):'',dipendentiIds:l.dipendentiIds||[],oreMap:l.oreMap||{}}); setSettComplete([]); setM('edit'); };
  const openCompleta=l=>{ setForm({...l,settoreIds:lavSettori(l),ore:l.ore!=null?String(l.ore):'',dipendentiIds:l.dipendentiIds||[],oreMap:l.oreMap||{}}); setSettComplete(lavSettori(l)); setM('completa'); };
  const sav=async(completa)=>{
    if(completa){
      if(!(form.dipendentiIds||[]).length){alert('Per completare seleziona almeno un dipendente.');return;}
      if((form.dipendentiIds||[]).some(id=>!parseFloat((form.oreMap||{})[id]))){alert('Inserisci le ore per ogni dipendente.');return;}
      const allSett=lavSettori(form);
      if(allSett.length && !settComplete.length){alert('Seleziona almeno un settore effettivamente lavorato.');return;}
    }
    setSaving(true);
    const totOre=(form.dipendentiIds||[]).reduce((s,id)=>s+(parseFloat((form.oreMap||{})[id])||0),0);
    const allSett=lavSettori(form);
    const fatti=settComplete.filter(id=>allSett.includes(id));
    const restanti=allSett.filter(id=>!fatti.includes(id));

    let nuoveLav;
    if(completa && allSett.length>1 && restanti.length>0){
      // SPLIT: i settori lavorati diventano una riga completata, i restanti restano confermati
      const completataRow={...form,settoreIds:fatti,settoreId:fatti[0]||'',ore:totOre||null,oreMap:form.oreMap||{},stato:'completata',varietaId:fatti.length===1?form.varietaId:''};
      const apertaRow={...form,id:gid(),settoreIds:restanti,settoreId:restanti[0]||'',ore:null,oreMap:{},dipendentiIds:[],stato:'confermata',varietaId:restanti.length===1?form.varietaId:'',confermataAt:form.confermataAt||new Date().toISOString()};
      nuoveLav=data.lavorazioni.flatMap(l=>l.id===form.id?[completataRow,apertaRow]:[l]);
    } else {

      const updated={...form,ore:totOre||null,oreMap:form.oreMap||{},stato:completa?'completata':'confermata',settoreIds:completa?(fatti.length?fatti:allSett):allSett,settoreId:(completa?(fatti[0]||allSett[0]):allSett[0])||''};
      nuoveLav=data.lavorazioni.map(l=>l.id===form.id?updated:l);
    }
    await save({...data,lavorazioni:nuoveLav});
    setSaving(false);close();
  };

function ReportTab({data,centroId,user}){
  const excelOk=pianoOf(user)!=='starter';
  const [f,setF]=useState({da:'',a:'',tipoId:'',dipId:'',settoreId:'',centroId:centroId||''});
  const [view,setView]=useState('tabella'); // tabella | riepilogo

  const centri=data.centri||[];
  const settoriDisp=f.centroId?(data.settori||[]).filter(s=>s.centroId===f.centroId):(data.settori||[]);

  const lav=(data.lavorazioni||[]).filter(l=>{
    if(l.stato!=='completata')return false;
    if(centroId&&l.centroId!==centroId)return false;
    if(f.centroId&&l.centroId!==f.centroId)return false;
    if(f.settoreId&&!lavSettori(l).includes(f.settoreId))return false;
    if(f.tipoId&&l.tipoId!==f.tipoId)return false;
    if(f.dipId&&!(l.dipendentiIds||[]).includes(f.dipId))return false;
    if(f.da&&String(l.data)<f.da)return false;
    if(f.a&&String(l.data)>f.a)return false;
    return true;
  }).sort((a,b)=>String(b.data).localeCompare(String(a.data)));

  const totOre=lav.reduce((s,l)=>s+(l.ore||0),0);
  const totDip=new Set(lav.flatMap(l=>l.dipendentiIds||[])).size;

  // Per riepilogo: raggruppa per tipo
  const perTipo=(data.tipi||[]).map(t=>{
    const tl=lav.filter(l=>l.tipoId===t.id);
    return{...t,n:tl.length,ore:tl.reduce((s,l)=>s+(l.ore||0),0)};
  }).filter(t=>t.n>0).sort((a,b)=>b.ore-a.ore);

  const perSettore=(data.settori||[]).filter(s=>centroId?s.centroId===centroId:true).map(s=>{
    const sl=lav.filter(l=>lavSettori(l).includes(s.id));
    return{...s,n:sl.length,ore:sl.reduce((x,l)=>x+(l.ore||0),0)};
  }).filter(s=>s.n>0).sort((a,b)=>b.ore-a.ore);

  const perDip=(data.dipendenti||[]).map(d=>{
    const dl=lav.filter(l=>(l.dipendentiIds||[]).includes(d.id));
    const oreD=dl.reduce((s,l)=>s+(parseFloat((l.oreMap||{})[d.id])||0),0);
    return{...d,n:dl.length,ore:oreD};
  }).filter(d=>d.n>0).sort((a,b)=>b.ore-a.ore);

  const getNome=(l)=>{
    const c2=(data.centri||[]).find(x=>x.id===l.centroId);
    const s=settoriNomi(l,data.settori);
    const t=(data.tipi||[]).find(x=>x.id===l.tipoId);
    const nomi=(l.dipendentiIds||[]).map(id=>{const d=(data.dipendenti||[]).find(x=>x.id===id);return d?d.cognome+' '+(d.nome||''):'?';}).join(', ');
    return{centro:c2?.nome||'',settore:s||'',tipo:t?.nome||'',varieta:l.varietaId||'',nomi,ore:l.ore||0};
  };

  const exportXls=()=>{
    const wb=XLSX.utils.book_new();

    // Sheet 1: Dettaglio lavorazioni
    const hasDip=!!f.dipId;
    const dipName=hasDip?((data.dipendenti||[]).find(x=>x.id===f.dipId)||{}).cognome||'':'';

    const rows1=[hdr1];
    lav.forEach(l=>{

      const row=[l.data||'',centro,settore,varieta,tipo,nomi];
      if(hasDip)row.push(parseFloat((l.oreMap||{})[f.dipId])||0);
      row.push(ore,l.quantita||'',l.note||'');

    const period=(f.da||f.a)?(f.da||'inizio')+'_'+(f.a||'oggi'):'tutti';

/* ── RICHIESTE ── */
function RichiesteTab({data,save,user,isAdmin,centroId}){
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [saving,setSaving]=useState(false);
  const F=k=>e=>setForm(f=>({...f,[k]:e.target.value}));

  const TIPI_RICH=[
    {id:'personale', label:'👷 Personale',    desc:'Richiesta di dipendenti'},
    {id:'attrezzatura',label:'🔧 Attrezzatura / Mezzi', desc:'Strumenti, mezzi o materiali'},
    {id:'altro',    label:'📦 Altro',          desc:'Altra necessità'},
  ];

  const [mostraChiuse,setMostraChiuse]=useState(false);
  const richieste=(data.richieste||[]).filter(r=>{
    if(!mostraChiuse&&r.stato==='chiusa')return false;
    if(isAdmin){if(centroId&&r.centroId!==centroId)return false;return true;}
    return(user.centroIds||[]).includes(r.centroId);
  }).sort((a,b)=>{
    if(a.urgente&&!b.urgente)return -1;if(!a.urgente&&b.urgente)return 1;
    return String(a.dataRichiesta||'').localeCompare(String(b.dataRichiesta||''));
  });

  const pendenti=richieste.filter(r=>r.stato==='pendente').length;

  const apriNuova=()=>{
    const cid=centroId||(user.centroIds||[])[0]||'';
    setForm({centroId:cid,tipoRichiesta:'personale',dataRichiesta:'',nDipendenti:'',descrizione:'',note:'',urgente:false});
    setModal('nuova');
  };
  const apriGestisci=r=>{setForm({...r,noteAdmin:r.noteAdmin||'',dipendentiIds:r.dipendentiIds||[]});setModal('gestisci');};
  const close=()=>{setModal(null);setForm({});};

  const inviaNuova=async()=>{
    if(!form.centroId||!form.descrizione?.trim()){alert('Compila almeno il tipo di lavoro/descrizione.');return;}
    if(form.tipoRichiesta==='personale'&&!form.nDipendenti){alert('Indica il numero di dipendenti richiesti.');return;}
    setSaving(true);
    const nuova={id:gid(),centroId:form.centroId,tipoRichiesta:form.tipoRichiesta||'personale',
      dataRichiesta:form.dataRichiesta||'',nDipendenti:parseInt(form.nDipendenti)||0,
      descrizione:form.descrizione,note:form.note||'',urgente:!!form.urgente,
      stato:'pendente',createdBy:user.id,createdAt:new Date().toISOString(),noteAdmin:'',dipendentiIds:[]};
    await save({...data,richieste:[...(data.richieste||[]),nuova]});
    const centro=(data.centri||[]).find(x=>x.id===form.centroId);
    const tipoLabel=TIPI_RICH.find(t=>t.id===form.tipoRichiesta)?.label||form.tipoRichiesta;
    const urgStr=form.urgente?'🚨 URGENTE — ':'';
    const msg=`🌿 <b>${user.tenant.nome} — ${urgStr}Nuova richiesta</b>\n\n`+
      `👤 <b>Responsabile:</b> ${user.nome}\n`+
      `📍 <b>Centro:</b> ${centro?.nome||'—'}\n`+
      `📋 <b>Tipo:</b> ${tipoLabel}\n`+
      `📝 <b>Descrizione:</b> ${form.descrizione}\n`+
      (form.tipoRichiesta==='personale'&&form.nDipendenti?`👷 <b>Dipendenti richiesti:</b> ${form.nDipendenti}\n`:'')+
      (form.dataRichiesta?`📅 <b>Data:</b> ${form.dataRichiesta}\n`:'')+
      (form.note?`💬 <b>Note:</b> ${form.note}\n`:'')+
      `\n🔗 <a href="https://app.vivaioapp.it/">Apri gestionale → Richieste</a>`;
    await notifyAdmin(msg, data);
    setSaving(false);close();
  };

  const tog=id=>setForm(f=>{const inList=(f.dipendentiIds||[]).includes(id);return{...f,dipendentiIds:inList?(f.dipendentiIds||[]).filter(x=>x!==id):[...(f.dipendentiIds||[]),id]};});

  const rispondi=async(approva)=>{
    setSaving(true);
    const dipAssegnati=approva&&form.tipoRichiesta==='personale'?(form.dipendentiIds||[]):[];
    const updated={...form,stato:approva?'approvata':'rifiutata',noteAdmin:form.noteAdmin||'',dipendentiIds:dipAssegnati,rispostaAt:new Date().toISOString()};
    await save({...data,richieste:(data.richieste||[]).map(r=>r.id===form.id?updated:r)});
    const centro=(data.centri||[]).find(x=>x.id===form.centroId);
    const tipoLabel=TIPI_RICH.find(t=>t.id===form.tipoRichiesta)?.label||form.tipoRichiesta;
    const stato=approva?'✅ APPROVATA':'❌ RIFIUTATA';
    const nomi=approva&&dipAssegnati.length>0?dipAssegnati.map(id=>{const d=(data.dipendenti||[]).find(x=>x.id===id);return d?d.cognome:'?';}).join(', '):'';
    const msg=`🌿 <b>${user.tenant.nome} — Richiesta ${stato}</b>\n\n`+
      `📍 <b>Centro:</b> ${centro?.nome||'—'}\n`+
      `📋 <b>Tipo:</b> ${tipoLabel}\n`+
      `📝 <b>Descrizione:</b> ${form.descrizione}\n`+
      (approva&&nomi?`👷 <b>Dipendenti assegnati:</b> ${nomi}\n`:'')+
      (form.noteAdmin?`💬 <b>Risposta titolare:</b> ${form.noteAdmin}`:'');
    await notifyResponsabili(form.centroId, msg, data);
    setSaving(false);close();
  };

  const del=async id=>{if(!confirm('Eliminare?'))return;await save({...data,richieste:(data.richieste||[]).filter(r=>r.id!==id)});};

  const STATO={
    pendente:  {label:'In attesa', bg:'#FAC775',tx:'#633806'},
    approvata: {label:'Approvata', bg:'#C0DD97',tx:'#27500A'},
    rifiutata: {label:'Rifiutata', bg:'#F7C1C1',tx:'#A32D2D'},
    chiusa:    {label:'Chiusa',    bg:'#D3D1C7',tx:'#444441'}
  };
  const TIPO_ICON={personale:'👷',attrezzatura:'🔧',altro:'📦'};

  return h('div',null,
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem',flexWrap:'wrap',gap:'8px'}},
      h('div',null,
        h('h3',{style:{fontSize:'15px',fontWeight:500,marginBottom:'2px'}},'Richieste'),
        pendenti>0&&h('span',{style:{fontSize:'13px',color:'#A32D2D',fontWeight:500}},pendenti+' in attesa di risposta')
      ),
      h('div',{style:{display:'flex',gap:'8px',alignItems:'center'}},
        h('label',{style:{display:'flex',alignItems:'center',gap:'6px',fontSize:'13px',color:'#666',cursor:'pointer'}},
          h('input',{type:'checkbox',checked:mostraChiuse,onChange:e=>setMostraChiuse(e.target.checked),style:{width:'16px',height:'16px'}}),
          'Mostra chiuse'
        ),
        !isAdmin&&h('button',{onClick:apriNuova,className:'btn-g'},'+ Nuova richiesta')
      )
    ),

    richieste.length===0
      ?h('div',{className:'card'},h('p',{style:{fontSize:'14px',color:'#666'}},isAdmin?'Nessuna richiesta ricevuta.':'Nessuna richiesta inviata.'))
      :h('div',{style:{display:'flex',flexDirection:'column',gap:'10px'}},
        richieste.map(r=>{
          const centro=(data.centri||[]).find(x=>x.id===r.centroId);
          const s=STATO[r.stato]||STATO.pendente;
          const nomi=(r.dipendentiIds||[]).map(id=>{const d=(data.dipendenti||[]).find(x=>x.id===id);return d?d.cognome:'?';}).join(', ');
          const icon=TIPO_ICON[r.tipoRichiesta]||'📦';
          return h('div',{key:r.id,className:'card',style:{borderLeft:'4px solid '+(r.urgente?'#E24B4A':r.stato==='approvata'?'#639922':r.stato==='rifiutata'?'#F7C1C1':'#FAC775')}},
            h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'8px',flexWrap:'wrap',gap:'6px'}},
              h('div',{style:{display:'flex',gap:'6px',alignItems:'center',flexWrap:'wrap'}},
                r.urgente&&h('span',{style:{fontSize:'12px',background:'#E24B4A',color:'#fff',borderRadius:'4px',padding:'2px 8px',fontWeight:600}},'🚨 URGENTE'),
                h('span',{style:{fontSize:'12px',background:'#f5f5f3',color:'#444',borderRadius:'4px',padding:'2px 8px'}},icon+' '+(TIPI_RICH.find(t=>t.id===r.tipoRichiesta)?.label.replace(/^[^\s]+\s/,'')||r.tipoRichiesta||'—')),
                h('span',{style:{fontSize:'12px',background:s.bg,color:s.tx,borderRadius:'4px',padding:'2px 8px',fontWeight:500}},s.label)
              ),
              h('div',{style:{display:'flex',gap:'6px'}},
                isAdmin&&r.stato==='pendente'&&h('button',{onClick:()=>apriGestisci(r),className:'btn-g sm'},'Rispondi'),
                r.stato!=='pendente'&&r.stato!=='chiusa'&&h('button',{onClick:async()=>{await save({...data,richieste:(data.richieste||[]).map(x=>x.id===r.id?{...x,stato:'chiusa'}:x)});},className:'btn-n sm'},'✓ Chiudi'),
                h('button',{onClick:()=>del(r.id),className:'btn-r sm'},'🗑')
              )
            ),
            h('p',{style:{fontSize:'14px',fontWeight:500,marginBottom:'6px'}},r.descrizione),
            h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(120px,1fr))',gap:'4px',fontSize:'13px',color:'#666'}},
              isAdmin&&h('span',null,'📍 ',centro?.nome||'—'),
              r.tipoRichiesta==='personale'&&r.nDipendenti>0&&h('span',null,'👷 ',r.nDipendenti,' dip. richiesti'),
              r.dataRichiesta&&h('span',null,'📅 ',r.dataRichiesta)
            ),
            r.note&&h('p',{style:{fontSize:'13px',color:'#888',marginTop:'6px'}},'💬 '+r.note),
            r.stato!=='pendente'&&r.noteAdmin&&h('p',{style:{fontSize:'13px',color:'#3B6D11',marginTop:'6px'}},'✅ Titolare: '+r.noteAdmin),
            r.stato==='approvata'&&nomi&&h('p',{style:{fontSize:'13px',color:'#27500A',marginTop:'4px',fontWeight:500}},'👷 Assegnati: '+nomi)
          );
        })
      ),

    /* ── MODAL NUOVA RICHIESTA ── */
    modal==='nuova'&&h(Modal,{title:'Nuova richiesta',onClose:close},
      !centroId&&h('div',{style:{marginBottom:'12px'}},
        h('label',{className:'lbl'},'Centro *'),
        h('select',{value:form.centroId||'',onChange:F('centroId')},
          h('option',{value:''},'— Seleziona —'),
          (user.centroIds||[]).map(id=>{const cc=(data.centri||[]).find(x=>x.id===id);return cc?h('option',{key:id,value:id},cc.nome):null;})
        )
      ),

      h('label',{className:'lbl'},'Tipo di richiesta *'),
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px',marginBottom:'14px'}},
        TIPI_RICH.map(t=>h('label',{key:t.id,style:{display:'flex',flexDirection:'column',alignItems:'center',gap:'4px',cursor:'pointer',padding:'10px 6px',borderRadius:'10px',border:'1px solid '+(form.tipoRichiesta===t.id?'#3B6D11':'#e5e5e5'),background:form.tipoRichiesta===t.id?'#EAF3DE':'#fff',textAlign:'center'}},
          h('input',{type:'radio',name:'tipoRich',value:t.id,checked:form.tipoRichiesta===t.id,onChange:F('tipoRichiesta'),style:{display:'none'}}),
          h('span',{style:{fontSize:'22px'}},t.label.split(' ')[0]),
          h('span',{style:{fontSize:'12px',fontWeight:form.tipoRichiesta===t.id?600:400,color:form.tipoRichiesta===t.id?'#3B6D11':'#666'}},t.label.replace(/^[^\s]+\s/,''))
        ))
      ),

      h('label',{className:'lbl'},form.tipoRichiesta==='personale'?'Tipo di lavoro *':form.tipoRichiesta==='attrezzatura'?'Cosa ti serve *':'Descrizione *'),
      h('input',{value:form.descrizione||'',onChange:F('descrizione'),placeholder:
        form.tipoRichiesta==='personale'?'Es. Irrigazione settore S3, Potatura...':
        form.tipoRichiesta==='attrezzatura'?'Es. Trattore, pompa irroratrice, vasi 14cm...':
        'Descrivi la necessità...',
        style:{marginBottom:'12px'}}),

      form.tipoRichiesta==='personale'&&h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'12px'}},
        h('div',null,h('label',{className:'lbl'},'N. dipendenti richiesti *'),h('input',{type:'number',min:'1',value:form.nDipendenti||'',onChange:F('nDipendenti'),placeholder:'Es. 3'})),
        h('div',null,h('label',{className:'lbl'},'Data'),h('input',{type:'date',value:form.dataRichiesta||'',onChange:F('dataRichiesta')}))
      ),

      form.tipoRichiesta!=='personale'&&h('div',{style:{marginBottom:'12px'}},
        h('label',{className:'lbl'},'Data in cui serve'),
        h('input',{type:'date',value:form.dataRichiesta||'',onChange:F('dataRichiesta')})
      ),

      h('label',{className:'lbl'},'Note aggiuntive'),
      h('textarea',{value:form.note||'',onChange:F('note'),rows:2,style:{marginBottom:'12px'},placeholder:'Ulteriori dettagli, urgenza...'}),

      h('label',{style:{display:'flex',alignItems:'center',gap:'10px',cursor:'pointer',fontSize:'14px',marginBottom:'1.25rem',padding:'10px',background:'#FFF5F5',borderRadius:'8px',border:'1px solid #F7C1C1'}},
        h('input',{type:'checkbox',checked:!!form.urgente,onChange:e=>setForm(f=>({...f,urgente:e.target.checked})),style:{width:'18px',height:'18px',accentColor:'#E24B4A'}}),
        h('span',null,'🚨 Segnala come ',h('b',null,'URGENTE'))
      ),
      h('button',{onClick:inviaNuova,className:'btn-g',style:{width:'100%'},disabled:saving},saving?'Invio...':'Invia richiesta')
    ),

    /* ── MODAL GESTISCI (admin) ── */
    modal==='gestisci'&&h(Modal,{title:'Rispondi alla richiesta',onClose:close},
      h('div',{style:{background:'#f5f5f3',borderRadius:'8px',padding:'12px',marginBottom:'14px',fontSize:'13px'}},
        h('div',{style:{display:'flex',gap:'8px',alignItems:'center',marginBottom:'6px'}},
          h('span',{style:{fontSize:'16px'}},TIPO_ICON[form.tipoRichiesta]||'📦'),
          h('span',{style:{fontWeight:600,fontSize:'14px'}},form.descrizione)
        ),
        h('div',{style:{display:'flex',gap:'12px',flexWrap:'wrap',color:'#666'}},
          h('span',null,'📍 ',((data.centri||[]).find(x=>x.id===form.centroId)?.nome)||'—'),
          form.tipoRichiesta==='personale'&&form.nDipendenti>0&&h('span',null,'👷 ',form.nDipendenti,' richiesti'),
          form.dataRichiesta&&h('span',null,'📅 ',form.dataRichiesta),
          form.urgente&&h('span',{style:{color:'#E24B4A',fontWeight:600}},'🚨 URGENTE')
        ),
        form.note&&h('p',{style:{marginTop:'6px',color:'#666'}},'💬 '+form.note)
      ),

      form.tipoRichiesta==='personale'&&h('div',null,
        h('label',{className:'lbl'},'Assegna dipendenti'),
        h('div',{style:{border:'1px solid #ccc',borderRadius:'8px',padding:'8px',maxHeight:'180px',overflowY:'auto',marginBottom:'10px'}},
          [...(data.dipendenti||[])].sort((a,b)=>(a.cognome||'').localeCompare(b.cognome||'')).map(d=>
            h('label',{key:d.id,style:{display:'flex',alignItems:'center',gap:'10px',padding:'8px 4px',cursor:'pointer',fontSize:'14px',borderBottom:'1px solid #f5f5f3'}},
              h('input',{type:'checkbox',checked:(form.dipendentiIds||[]).includes(d.id),onChange:()=>tog(d.id)}),
              d.cognome+' '+(d.nome||'')
            )
          )
        ),
        (form.dipendentiIds||[]).length>0&&h('p',{style:{fontSize:'12px',color:'#3B6D11',marginBottom:'10px'}},'✓ '+(form.dipendentiIds||[]).length+' selezionati')
      ),

      h('label',{className:'lbl'},'Risposta / nota per il responsabile'),
      h('textarea',{value:form.noteAdmin||'',onChange:F('noteAdmin'),rows:3,style:{marginBottom:'1.25rem'},placeholder:
        form.tipoRichiesta==='personale'?'Es. Ho assegnato Mario e Luigi, arriveranno alle 7:00...':
        form.tipoRichiesta==='attrezzatura'?'Es. Il trattore sarà disponibile domani mattina...':
        'La tua risposta...'}),

      h('div',{style:{display:'flex',gap:'10px'}},
        h('button',{onClick:()=>rispondi(true),className:'btn-g',style:{flex:1},disabled:saving},saving?'...':'✅ Approva'),
        h('button',{onClick:()=>rispondi(false),style:{flex:1,border:'1px solid #F7C1C1',background:'#fff',borderRadius:'8px',padding:'10px',fontSize:'14px',cursor:'pointer',color:'#A32D2D'},disabled:saving},saving?'...':'❌ Rifiuta')
      )
    )
  );
}

/* ── RESP SETTORI TAB ── */
function RespSettoriTab({data,save,centroId}){
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [saving,setSaving]=useState(false);
  const F=k=>e=>setForm(f=>({...f,[k]:e.target.value}));

  const centro=(data.centri||[]).find(c=>c.id===centroId);
  const setts=(data.settori||[]).filter(s=>s.centroId===centroId);

  const openSettore=(item={})=>{setForm({...item,varieta:item.varieta||[]});setModal('settore');};
  const close=()=>{setModal(null);setForm({});};

  const savSettore=async()=>{
    if(!form.nome?.trim())return;
    setSaving(true);
    const varieta=(form.varieta||[]).filter(v=>v.nome?.trim()).map(v=>({nome:v.nome,quantita:parseInt(v.quantita)||0,vaso:v.vaso||'',fornitore:v.fornitore||'',dataEntrata:v.dataEntrata||''}));
    const totPiante=varieta.reduce((s,v)=>s+(parseInt(v.quantita)||0),0);
    const sClean={...form,varieta,capacita:totPiante||parseInt(form.capacita)||0,
      lunghezza:form.lunghezza?parseFloat(form.lunghezza):null,
      larghezza:form.larghezza?parseFloat(form.larghezza):null,
      fornitore:form.fornitore||'',dataEntrata:form.dataEntrata||null,note:form.note||''};
    const newSettori=form.id?data.settori.map(x=>x.id===form.id?sClean:x):[...data.settori,{id:gid(),centroId,...sClean}];
    await save({...data,settori:newSettori});
    setSaving(false);close();
  };

  return h('div',null,
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}},
      h('h3',{style:{fontSize:'15px',fontWeight:500}},centro?.nome||'',' — ',setts.length,' settori'),
      h('button',{onClick:()=>openSettore(),className:'btn-g sm'},'+ Aggiungi')
    ),
    h('div',{style:{display:'flex',flexDirection:'column',gap:'8px'}},
      setts.length===0?h('div',{className:'card',style:{textAlign:'center',padding:'2rem'}},
        h('p',{style:{color:'#666',fontSize:'14px'}},'Nessun settore.')
      ):
      setts.map(s=>h('div',{key:s.id,className:'card',style:{cursor:'pointer'},onClick:()=>openSettore(s)},
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'6px'}},
          h('div',null,
            h('div',{style:{fontWeight:600,fontSize:'15px'}},s.nome),
            s.capacita>0&&h('div',{style:{fontSize:'13px',color:'#3B6D11',marginTop:'2px'}},'🌱 '+s.capacita.toLocaleString('it-IT')+' piante')
          ),
          h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},
            s.lunghezza&&s.larghezza&&h('span',{style:{fontSize:'12px',color:'#888'}},s.lunghezza+'×'+s.larghezza+' m'),
            h('span',{style:{fontSize:'20px',color:'#ccc'}},'›')
          )
        ),
        s.varieta&&s.varieta.length>0&&h('div',{style:{display:'flex',flexWrap:'wrap',gap:'4px',marginTop:'6px'}},
          s.varieta.filter(v=>v.nome).map((v,i)=>h('span',{key:i,style:{fontSize:'11px',background:'#EAF3DE',color:'#27500A',borderRadius:'4px',padding:'2px 8px'}},
            v.nome+(v.vaso?' v.'+v.vaso:'')+(v.quantita?' ('+v.quantita.toLocaleString('it-IT')+')':'')
          ))
        ),
        s.note&&h('p',{style:{fontSize:'12px',color:'#888',marginTop:'6px'}},s.note)
      ))
    ),
    modal==='settore'&&h(Modal,{title:form.id?'Modifica settore':'Nuovo settore',onClose:close},
      h('label',{className:'lbl'},'Nome settore *'),
      h('input',{value:form.nome||'',onChange:F('nome'),style:{marginBottom:'14px'}}),

      h('label',{className:'lbl'},'Varietà di piante'),
      h('div',{style:{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'8px'}},
        (form.varieta||[]).map((v,i)=>h('div',{key:i,style:{background:'#f9f9f7',borderRadius:'10px',padding:'10px',border:'1px solid #e5e5e5',position:'relative'}},
          h('button',{onClick:()=>setForm(f=>({...f,varieta:(f.varieta||[]).filter((_,j)=>j!==i)})),
            style:{position:'absolute',top:'8px',right:'8px',background:'transparent',border:'none',color:'#A32D2D',cursor:'pointer',fontSize:'18px',lineHeight:1,padding:0}},'×'),
          h('label',{className:'lbl'},'Varietà / tipologia'),
          h('input',{value:v.nome||'',onChange:e=>{const vs=[...(form.varieta||[])];vs[i]={...vs[i],nome:e.target.value};setForm(f=>({...f,varieta:vs}));},
            placeholder:'Es. Rosa Rossa, Basilico...',style:{marginBottom:'8px'}}),
          h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'8px'}},
            h('div',null,h('label',{className:'lbl'},'Quantità'),h('input',{type:'number',value:v.quantita||'',onChange:e=>{const vs=[...(form.varieta||[])];vs[i]={...vs[i],quantita:parseInt(e.target.value)||0};setForm(f=>({...f,varieta:vs}));},placeholder:'0'})),
            h('div',null,h('label',{className:'lbl'},'Vaso'),h('input',{value:v.vaso||'',onChange:e=>{const vs=[...(form.varieta||[])];vs[i]={...vs[i],vaso:e.target.value};setForm(f=>({...f,varieta:vs}));},placeholder:'Es. 14cm'}))
          ),
          h('label',{className:'lbl'},'Fornitore'),
          h('input',{value:v.fornitore||'',onChange:e=>{const vs=[...(form.varieta||[])];vs[i]={...vs[i],fornitore:e.target.value};setForm(f=>({...f,varieta:vs}));},
            placeholder:'Nome fornitore',style:{marginBottom:'8px'}}),
          h('label',{className:'lbl'},'Data entrata'),
          h('input',{type:'date',value:v.dataEntrata||'',onChange:e=>{const vs=[...(form.varieta||[])];vs[i]={...vs[i],dataEntrata:e.target.value};setForm(f=>({...f,varieta:vs}));}})
        )),
        h('button',{
          onClick:()=>setForm(f=>({...f,varieta:[...(f.varieta||[]),{nome:'',quantita:0,vaso:'',fornitore:'',dataEntrata:''}]})),
          style:{background:'transparent',border:'1px dashed #3B6D11',borderRadius:'8px',color:'#3B6D11',cursor:'pointer',padding:'10px',fontSize:'14px',width:'100%'}
        },'+ Aggiungi varietà')
      ),
      (form.varieta||[]).length>0&&h('p',{style:{fontSize:'12px',color:'#3B6D11',marginBottom:'14px'}},
        '📦 Totale: '+((form.varieta||[]).reduce((s,v)=>s+(parseInt(v.quantita)||0),0)).toLocaleString('it-IT')+' piante'
      ),

      h('label',{className:'lbl'},'Dimensione serra'),
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:'8px',alignItems:'center',marginBottom:'6px'}},
        h('div',null,h('label',{className:'lbl',style:{fontSize:'12px'}},'Lunghezza (m)'),h('input',{type:'number',step:'0.1',value:form.lunghezza||'',onChange:F('lunghezza'),placeholder:'Es. 50'})),
        h('span',{style:{textAlign:'center',color:'#999',paddingTop:'18px'}},'×'),
        h('div',null,h('label',{className:'lbl',style:{fontSize:'12px'}},'Larghezza arco (m)'),h('input',{type:'number',step:'0.1',value:form.larghezza||'',onChange:F('larghezza'),placeholder:'Es. 6.4'}))
      ),
      form.lunghezza&&form.larghezza&&h('p',{style:{fontSize:'12px',color:'#3B6D11',marginBottom:'12px'}},

function App(){
  const [loading,setLoading]=useState(true);
  const [dbErr,setDbErr]=useState(null);
  const [data,setData]=useState(null);
  const ref=useRef(null);
  const [user,setUser]=useState(()=>{
    try{const u=sessionStorage.getItem('va_user');return u?JSON.parse(u):null;}catch{return null;}
  });
  const [billingInterval,setBillingInterval]=useState('monthly');
  const [checkoutBusy,setCheckoutBusy]=useState(false);
  async function avviaCheckout(piano,interval){
    setCheckoutBusy(true);
    try{
      const r=await fetch(SB+'/functions/v1/stripe-checkout',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY,'apikey':KEY},body:JSON.stringify({tenantId:user.tenant.id,piano,interval})});
      const j=await r.json();
      if(j.url) window.location.href=j.url;
      else{ alert(j.error||'Errore avvio pagamento. Riprova o scrivi a support@vivaioapp.it'); setCheckoutBusy(false); }
    }catch(e){ alert('Errore di rete. Riprova o scrivi a support@vivaioapp.it'); setCheckoutBusy(false); }
  }

  // Al ritorno da Stripe dopo un pagamento riuscito, il tenant salvato in sessione è ancora quello
  // di prima del pagamento: lo ricarichiamo per riflettere subito piano/stato abbonamento aggiornati.
  useEffect(()=>{
    if(!user||!user.tenant) return;
    if(!window.location.search.includes('checkout=success')) return;
    (async()=>{
      const r=await fetch(SB+'/rest/v1/tenants?id=eq.'+user.tenant.id,{headers:SBH});
      const [freshTenant]=await r.json();
      if(freshTenant){
        const updated={...user,tenant:freshTenant};
        try{ sessionStorage.setItem('va_tenant',JSON.stringify(freshTenant)); sessionStorage.setItem('va_user',JSON.stringify(updated)); }catch{}
        setUser(updated);
      }
      window.history.replaceState({},'',window.location.pathname);
    })();
  },[]);

  useEffect(()=>{
    if(!user||!user.tenant){setLoading(false);return;}
    const _t=user.tenant.id;
    Promise.all([sbGet('centri',_t),sbGet('settori',_t),sbGet('dipendenti',_t),sbGet('tipi',_t),sbGet('utenti',_t),sbGet('lavorazioni',_t),sbGet('richieste',_t)]).then(([centri,settori,dipendenti,tipi,utenti,lavorazioni,richieste])=>{
        const normSett=settori.map(s=>({...s,varieta:(s.varieta||[]).map(v=>({nome:v.nome||'',quantita:v.quantita||0,vaso:v.vaso||'',fornitore:v.fornitore||'',dataEntrata:v.dataEntrata||''})),note:s.note||'',lunghezza:s.lunghezza||null,larghezza:s.larghezza||null}));
        settori=normSett;
        const normLav=lavorazioni.map(l=>({...l,dipendentiIds:l.dipendentiIds||[],oreMap:l.oreMap||{},data:l.data||'',priorita:l.priorita||'',stato:l.stato||'proposta',varietaId:l.varietaId||'',settoreIds:(Array.isArray(l.settoreIds)&&l.settoreIds.length)?l.settoreIds:(l.settoreId?[l.settoreId]:[])}));
        const d={centri,settori,dipendenti,tipi,utenti,lavorazioni:normLav,richieste:richieste||[]};
        setData(d);ref.current=d;setLoading(false);
      })
      .catch(()=>{setDbErr(true);setLoading(false);});
  },[user]);

  // Auto-refresh lavorazioni ogni 60s quando l'admin è loggato
  // Auto-refresh for all users every 30s
  const lastReminderRef=useRef(Date.now());
  useEffect(()=>{
    if(!user)return;
    const t=setInterval(()=>{
      const _tr2=user&&user.tenant?user.tenant.id:'';Promise.all([sbGet('lavorazioni',_tr2),sbGet('richieste',_tr2)]).then(([lavorazioni,richieste])=>{
        const normLav=lavorazioni.map(l=>({...l,dipendentiIds:l.dipendentiIds||[],oreMap:l.oreMap||{},data:l.data||'',priorita:l.priorita||'',stato:l.stato||'proposta',varietaId:l.varietaId||'',settoreIds:(Array.isArray(l.settoreIds)&&l.settoreIds.length)?l.settoreIds:(l.settoreId?[l.settoreId]:[])}));
        const nd={...ref.current,lavorazioni:normLav,richieste:richieste||[]};
        setData(nd);ref.current=nd;

        // Reminder urgenti ogni 30 minuti (solo admin, feature Pro)
        if(user.ruolo==='admin'&&pianoOf(user)!=='starter'){
          const now=Date.now();
          if(now-lastReminderRef.current>=30*60*1000){
            const urgenti=(richieste||[]).filter(r=>r.stato==='pendente'&&r.urgente);
            if(urgenti.length>0){
              lastReminderRef.current=now;
              const lines=urgenti.map(r=>{
                const centro=(nd.centri||[]).find(x=>x.id===r.centroId);
                return '🚨 '+(centro?.nome||'—')+' — '+r.descrizione;
              }).join('\n');
              const remMsg=`⏰ <b>Reminder ${user.tenant.nome}</b>

Hai ${urgenti.length} richiesta${urgenti.length>1?'e':''} urgente${urgenti.length>1?'':''} in attesa di risposta:

${lines}

🔗 <a href="https://app.vivaioapp.it/">Apri gestionale → Richieste</a>`;
              notifyAdmin(remMsg, nd);
            }
          }
        }
      }).catch(()=>{});
    },30000);
    return()=>clearInterval(t);
  },[user]);

  useEffect(()=>{
    if(!user||user.ruolo!=='admin')return;
    const t=setInterval(()=>{
      const _tr2=user&&user.tenant?user.tenant.id:'';Promise.all([sbGet('lavorazioni',_tr2),sbGet('richieste',_tr2)]).then(([lavorazioni,richieste])=>{
        const normLav=lavorazioni.map(l=>({...l,dipendentiIds:l.dipendentiIds||[],oreMap:l.oreMap||{},data:l.data||'',priorita:l.priorita||'',stato:l.stato||'proposta',varietaId:l.varietaId||'',settoreIds:(Array.isArray(l.settoreIds)&&l.settoreIds.length)?l.settoreIds:(l.settoreId?[l.settoreId]:[])}));
        const nd={...ref.current,lavorazioni:normLav,richieste:richieste||[]};
        setData(nd);ref.current=nd;
      }).catch(()=>{});
    },30000);
    return()=>clearInterval(t);
  },[user]);

  function sanitize(tbl,item){
    if(tbl==='lavorazioni')return{
      id:item.id,
      centroId:item.centroId||'',
      settoreId:item.settoreId||'',
      settoreIds:Array.isArray(item.settoreIds)?item.settoreIds:(item.settoreId?[item.settoreId]:[]),
      tipoId:item.tipoId||'',
      varietaId:item.varietaId||'',
      data:item.data||null,
      ore:item.ore!=null&&item.ore!==''?parseFloat(item.ore):null,
      oreMap:item.oreMap||{},
      dipendentiIds:item.dipendentiIds||[],
      priorita:item.priorita||'',
      stato:item.stato||'proposta',
      quantita:item.quantita||'',
      note:item.note||'',
      confermataAt:item.confermataAt||null
    };
    if(tbl==='richieste')return{...item,
      dataRichiesta:item.dataRichiesta||null,
      nDipendenti:parseInt(item.nDipendenti)||0,
      dipendentiIds:item.dipendentiIds||[],
      urgente:!!item.urgente,
      stato:item.stato||'pendente',
      tipoRichiesta:item.tipoRichiesta||'personale',
      descrizione:item.descrizione||'',
      note:item.note||'',
      noteAdmin:item.noteAdmin||'',
      createdBy:item.createdBy||'',
      rispostaAt:item.rispostaAt||null
    };
    if(tbl==='settori')return{
      id:item.id,
      centroId:item.centroId||'',
      nome:item.nome||'',
      capacita:parseInt(item.capacita)||0,
      varieta:item.varieta||[],
      lunghezza:item.lunghezza?parseFloat(item.lunghezza):null,
      larghezza:item.larghezza?parseFloat(item.larghezza):null,
      note:item.note||''
    };
    if(tbl==='utenti')return{
      id:item.id,
      nome:item.nome||'',
      username:item.user||item.username||'',
      pass:item.pass||'',
      ruolo:item.ruolo||'responsabile',
      centroIds:item.centroIds||[],
      tgChatId:item.tgChatId||''
    };
    if(tbl==='centri')return{
      id:item.id,
      nome:item.nome||''
    };
    if(tbl==='dipendenti')return{
      id:item.id,
      cognome:item.cognome||'',
      nome:item.nome||'',
      sesso:item.sesso||'UOMO'
    };
    return item;
  }
  async function save(newData){
    const tables=['centri','settori','dipendenti','tipi','utenti','lavorazioni','richieste'];
    for(const tbl of tables){
      const oldMap=new Map((ref.current[tbl]||[]).map(x=>[x.id,x]));
      const newMap=new Map((newData[tbl]||[]).map(x=>[x.id,x]));
      for(const[id]of oldMap)if(!newMap.has(id))await sbDel(tbl,id);
      for(const[id,item]of newMap){
        const clean=sanitize(tbl,item);
        if(!oldMap.has(id)){const _ci={...clean,tenantId:user&&user.tenant?user.tenant.id:''};const r=await sbIns(tbl,_ci);if(!r||r.error)console.error('Insert error',tbl,r);}
        else if(JSON.stringify(sanitize(tbl,oldMap.get(id)))!==JSON.stringify(clean))await sbUpd(tbl,id,clean);
      }
    }
    setData(newData);ref.current=newData;
  }

  async function refresh(){
    const _tr=user&&user.tenant?user.tenant.id:'';const [lavorazioni,richieste]=await Promise.all([sbGet('lavorazioni',_tr),sbGet('richieste',_tr)]);
    const norm=lavorazioni.map(l=>({...l,dipendentiIds:l.dipendentiIds||[],oreMap:l.oreMap||{},data:l.data||'',priorita:l.priorita||'',stato:l.stato||'proposta',settoreIds:(Array.isArray(l.settoreIds)&&l.settoreIds.length)?l.settoreIds:(l.settoreId?[l.settoreId]:[])}));
    const nd={...ref.current,lavorazioni:norm,richieste:richieste||[]};setData(nd);ref.current=nd;
  }

  if(!user)return h(Login,{onLogin:(u)=>{setLoading(true);setUser(u);}});

  // ── TRIAL CHECK ──
  if(user.tenant){
    const trialEnd = new Date(user.tenant.trialEndsAt);
    const now = new Date();
    const daysLeft = Math.ceil((trialEnd - now)/(1000*60*60*24));
    if(!user.tenant.attivo){
      return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'#f3f4f2',padding:'1.5rem'}},
        h('div',{style:{background:'white',borderRadius:'16px',padding:'2.5rem',maxWidth:'420px',textAlign:'center',boxShadow:'0 4px 24px rgba(0,0,0,0.1)'}},
          h('div',{style:{fontSize:'56px',marginBottom:'1rem'}},'⏸'),
          h('h2',{style:{fontSize:'20px',fontWeight:700,marginBottom:'8px'}},'Account sospeso'),
          h('p',{style:{color:'#666',fontSize:'14px',lineHeight:1.6,marginBottom:'1.5rem'}},'Il tuo account è stato sospeso. Contatta VivaioApp per riattivarlo.'),
          h('a',{href:'mailto:support@vivaioapp.it',style:{display:'block',background:'#3B6D11',color:'white',padding:'12px 24px',borderRadius:'10px',textDecoration:'none',fontWeight:700,fontSize:'15px',marginBottom:'12px'}},'📧 Contatta il supporto'),
          h('button',{onClick:()=>{sessionStorage.removeItem('va_user');sessionStorage.removeItem('va_tenant');setUser(null);},style:{background:'transparent',border:'none',color:'#aaa',cursor:'pointer',fontSize:'13px'}},'Esci')
        )
      );
    }
    const abbonamentoAttivo=['active','trialing','past_due'].includes(user.tenant.subscriptionStatus);
    if(daysLeft <= 0 && !abbonamentoAttivo){
      return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'#f3f4f2',padding:'1.5rem'}},
        h('div',{style:{background:'white',borderRadius:'16px',padding:'2.5rem',maxWidth:'420px',textAlign:'center',boxShadow:'0 4px 24px rgba(0,0,0,0.1)'}},
          h('div',{style:{fontSize:'56px',marginBottom:'1rem'}},'🌱'),
          h('h2',{style:{fontSize:'20px',fontWeight:700,marginBottom:'8px'}},'Trial scaduto'),
          h('p',{style:{color:'#666',fontSize:'14px',lineHeight:1.6,marginBottom:'1.5rem'}},'Il tuo periodo di prova gratuita è terminato. Contattaci per attivare il piano e continuare a usare VivaioApp.'),
          (()=>{
            const pianoAttuale=(user.tenant.piano==='enterprise')?'pro':(user.tenant.piano||'starter');
            const prezzi={starter:{monthly:39,annual:390},pro:{monthly:79,annual:790}};
            const p=prezzi[pianoAttuale];
            return h('div',null,
              user.tenant.piano==='enterprise'
                ?h('a',{href:'mailto:support@vivaioapp.it',style:{display:'block',background:'#3B6D11',color:'white',padding:'12px 24px',borderRadius:'10px',textDecoration:'none',fontWeight:700,fontSize:'15px',marginBottom:'12px'}},'🚀 Contattaci per riattivare')
                :h('div',null,
                  h('div',{style:{display:'flex',gap:'8px',justifyContent:'center',marginBottom:'14px'}},
                    h('button',{onClick:()=>setBillingInterval('monthly'),style:{padding:'6px 14px',borderRadius:'8px',border:'1.5px solid '+(billingInterval==='monthly'?'#3B6D11':'#ddd'),background:billingInterval==='monthly'?'#EAF3DE':'white',color:'#1a1a1a',fontSize:'13px',fontWeight:600,cursor:'pointer'}},'Mensile'),
                    h('button',{onClick:()=>setBillingInterval('annual'),style:{padding:'6px 14px',borderRadius:'8px',border:'1.5px solid '+(billingInterval==='annual'?'#3B6D11':'#ddd'),background:billingInterval==='annual'?'#EAF3DE':'white',color:'#1a1a1a',fontSize:'13px',fontWeight:600,cursor:'pointer'}},'Annuale — 2 mesi gratis')
                  ),
                  h('button',{onClick:()=>avviaCheckout(pianoAttuale,billingInterval),disabled:checkoutBusy,style:{width:'100%',background:'#3B6D11',color:'white',padding:'12px 24px',border:'none',borderRadius:'10px',fontWeight:700,fontSize:'15px',marginBottom:'12px',cursor:'pointer'}},
                    checkoutBusy?'Attendere...':'🚀 Attiva '+pianoAttuale.charAt(0).toUpperCase()+pianoAttuale.slice(1)+' — €'+p[billingInterval]+(billingInterval==='monthly'?'/mese':'/anno')
                  )
                ),
              h('a',{href:'https://vivaioapp.it/#prezzi',style:{display:'block',background:'transparent',border:'2px solid #3B6D11',color:'#3B6D11',padding:'10px 24px',borderRadius:'10px',textDecoration:'none',fontWeight:600,fontSize:'14px',marginBottom:'12px'}},'Vedi tutti i piani')
            );
          })(),
          h('button',{onClick:()=>{sessionStorage.removeItem('va_user');sessionStorage.removeItem('va_tenant');setUser(null);},style:{background:'transparent',border:'none',color:'#aaa',cursor:'pointer',fontSize:'13px'}},'Esci')
        )
      );
    }
    // Show trial warning banner if <= 3 days left
  }
  if(loading)return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',flexDirection:'column',gap:'16px'}},
    h('img',{src:'vivaioapp-logo-cropped.svg',alt:'VivaioApp',style:{height:'56px',width:'auto'}}),
    h('div',{className:'spin'}),
    h('p',{style:{fontSize:'15px',color:'#666'}},'Connessione al database...')
  );

  if(dbErr)return h('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',padding:'2rem'}},
    h('div',{className:'card',style:{maxWidth:'420px',textAlign:'center'}},
      h('div',{style:{fontSize:'40px',marginBottom:'1rem'}},'⚠️'),
      h('h2',{style:{marginBottom:'8px',fontSize:'16px'}},'Errore di connessione'),
      h('p',{style:{color:'#666',fontSize:'14px',marginBottom:'12px'}},'Impossibile connettersi al database Supabase.'),
      h('p',{style:{color:'#666',fontSize:'13px'}},'Verifica di aver eseguito lo script setup_supabase.sql e che le credenziali siano corrette.')
    )
  );

  
  if(user.ruolo==='admin')return h(AdminApp,{data,save,user,logout:()=>{sessionStorage.removeItem('va_user');sessionStorage.removeItem('va_tenant');setUser(null);},refresh});
  return h(RespApp,{data,save,user,logout:()=>{sessionStorage.removeItem('va_user');setUser(null);}});
}



// ── MOUNT ──
// Gestione tasto indietro Android
(function(){
  var navStack=['home'];
  window.__pushNav=function(tab){
    navStack.push(tab);
    history.pushState({tab:tab},'',window.location.href);
  };
  window.__setAppTab=null;
  history.replaceState({tab:'home'},'',window.location.href);
  window.addEventListener('popstate',function(e){
    if(navStack.length>1){
      navStack.pop();
      var prev=navStack[navStack.length-1];
      if(window.__setAppTab) window.__setAppTab(prev);
      history.pushState({tab:prev},'',window.location.href);
    } else {
      history.pushState({tab:'home'},'',window.location.href);
    }
  });
})();

function ImpostazioniTab({user,data,save}){
  const [nuovaPass,setNuovaPass]=React.useState('');
  const [confermaPass,setConfermaPass]=React.useState('');
  const [chatId,setChatId]=React.useState(user.tgChatId||'');
  const [okMsg,setOkMsg]=React.useState('');
  const [errMsg,setErrMsg]=React.useState('');
  const [portalBusy,setPortalBusy]=React.useState(false);

  const apriPortale=async()=>{
    setPortalBusy(true);
    try{
      const r=await fetch(SB+'/functions/v1/stripe-portal',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY,'apikey':KEY},body:JSON.stringify({tenantId:user.tenant.id})});
      const j=await r.json();
      if(j.url) window.location.href=j.url;
      else{ alert(j.error||'Errore. Riprova o scrivi a support@vivaioapp.it'); setPortalBusy(false); }
    }catch(e){ alert('Errore di rete. Riprova.'); setPortalBusy(false); }
  };

  const salvaPassword=async()=>{
    setOkMsg('');setErrMsg('');
    if(!nuovaPass.trim()){setErrMsg('Inserisci la nuova password.');return;}
    if(nuovaPass!==confermaPass){setErrMsg('Le password non coincidono.');return;}
    if(nuovaPass.length<6){setErrMsg('La password deve essere di almeno 6 caratteri.');return;}
    const utenti=(data.utenti||[]).map(u=>u.id===user.id?{...u,pass:nuovaPass}:u);
    await save({...data,utenti});
    setNuovaPass('');setConfermaPass('');
    setOkMsg('Password aggiornata con successo!');
  };

  const salvaChatId=async()=>{
    setOkMsg('');setErrMsg('');
    if(!chatId.trim()){setErrMsg('Inserisci il tuo Chat ID Telegram.');return;}
    const utenti=(data.utenti||[]).map(u=>u.id===user.id?{...u,tgChatId:chatId.trim()}:u);
    await save({...data,utenti});
    setOkMsg('Chat ID Telegram salvato!');
  };

  return h('div',{style:{display:'flex',flexDirection:'column',gap:'16px'}},
    h('div',{className:'card',style:{padding:'16px'}},
      h('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'10px'}},
        h('span',{style:{fontSize:'20px'}},'💳'),
        h('span',{style:{fontWeight:600,fontSize:'15px'}},'Abbonamento')
      ),
      h('p',{style:{fontSize:'13px',color:'#666',marginBottom:'12px'}},
        'Piano attuale: ',h('b',{style:{color:'#3B6D11',textTransform:'capitalize'}},user.tenant.piano||'starter'),
        user.tenant.billingInterval?(' · '+(user.tenant.billingInterval==='annual'?'fatturazione annuale':'fatturazione mensile')):''
      ),
      user.tenant.stripeCustomerId
        ?h('button',{className:'btn-g',onClick:apriPortale,disabled:portalBusy,style:{width:'100%'}},portalBusy?'Apertura...':'Gestisci abbonamento →')
        :h('p',{style:{fontSize:'12px',color:'#999'}},'Nessun abbonamento attivo su Stripe. Attivalo dalla schermata di fine prova, oppure scrivi a support@vivaioapp.it.')
    ),
    h('div',{className:'card',style:{padding:'16px'}},
      h('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'14px'}},
        h('span',{style:{fontSize:'20px'}},'🔑'),
        h('span',{style:{fontWeight:600,fontSize:'15px'}},'Cambia password')
      ),
      h('label',{className:'lbl'},'Nuova password'),
      h('input',{type:'password',value:nuovaPass,onChange:e=>setNuovaPass(e.target.value),
        placeholder:'Minimo 6 caratteri',style:{marginBottom:'10px'}}),
      h('label',{className:'lbl'},'Conferma password'),
      h('input',{type:'password',value:confermaPass,onChange:e=>setConfermaPass(e.target.value),
        placeholder:'Ripeti la password',style:{marginBottom:'12px'}}),
      h('button',{className:'btn-g',onClick:salvaPassword,style:{width:'100%'}},'Aggiorna password')
    ),
    h('div',{className:'card',style:{padding:'16px'}},
      h('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'8px'}},
        h('span',{style:{fontSize:'20px'}},'✈️'),
        h('span',{style:{fontWeight:600,fontSize:'15px'}},'Notifiche Telegram')
      ),
      h('p',{style:{fontSize:'12px',color:'#888',marginBottom:'10px',lineHeight:'1.5'}},
        'Per ricevere notifiche su Telegram, cerca ',h('b',null,'@vivaioapp_bot'),
        ' su Telegram, avvia la chat con /start e copia qui il tuo Chat ID.'
      ),
      h('label',{className:'lbl'},'Il tuo Chat ID Telegram'),
      h('input',{type:'text',value:chatId,onChange:e=>setChatId(e.target.value),
        placeholder:'Es. 123456789',style:{marginBottom:'12px'}}),
      h('button',{className:'btn-g',onClick:salvaChatId,style:{width:'100%'}},'Salva Chat ID')
    ),
    okMsg&&h('div',{style:{background:'#e8f5e0',color:'#2d6a1a',padding:'10px 14px',borderRadius:'8px',fontSize:'13px',fontWeight:500}},'✅ '+okMsg),
    errMsg&&h('div',{style:{background:'#ffeaea',color:'#c0392b',padding:'10px 14px',borderRadius:'8px',fontSize:'13px',fontWeight:500}},'⚠️ '+errMsg)
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
